{% extends "base.html" %}

{% block title %}Register - AI Interview Prep Suite{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center py-4 py-lg-5">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mb-3">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Create Account</h2>
                        <p class="text-muted mb-0">Set up your account to start preparing.</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('register', next=request.args.get('next')) }}" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required autocomplete="name" placeholder="Your name">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autocomplete="email" placeholder="you@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Confirm password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8" placeholder="Re-enter your password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Already have an account?
                        <a href="{{ url_for('login', next=request.args.get('next')) }}" class="text-decoration-none fw-semibold">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
