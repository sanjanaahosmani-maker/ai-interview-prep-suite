{% extends "base.html" %}

{% block title %}Login - AI Interview Prep Suite{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center py-4 py-lg-5">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon mb-3">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Welcome Back</h2>
                        <p class="text-muted mb-0">Log in to continue your interview preparation.</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autocomplete="email" placeholder="you@example.com">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Log In
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Don't have an account?
                        <a href="{{ url_for('register', next=request.args.get('next')) }}" class="text-decoration-none fw-semibold">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
